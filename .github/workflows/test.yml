name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run --with pytest pytest -q tests
      - run: ./bin/fsgc --help && for g in scan passthrough fixedseed sprite render3d video win backup publish kb; do ./bin/fsgc $g --help > /dev/null; done
      - name: passthrough plan (no games installed, no network)
        run: ./bin/fsgc passthrough plan minecraft "gta v" > /dev/null && ./bin/fsgc passthrough plan minecraft "gta v" --json > /dev/null
      - name: knowledge base
        run: ./bin/fsgc kb check --index
      - name: nothing that shouldn't ship
        run: ./bin/fsgc publish check .
